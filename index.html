<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>For You</title>
    <style>
        body {
            background: #0d0c0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #181614;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #2c2724;
            text-align: center;
            width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .title {
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .photo-frame {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            background: #231f1c;
            border: 1px solid #4a3b32;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .message-box {
            font-size: 1rem;
            line-height: 1.5;
            color: #a39081;
            min-height: 60px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }
        .btn {
            background: #ffffff;
            color: #0d0c0b;
            border: none;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: #a39081;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🎵 HOOD ANGELS</div>
        
        <div class="photo-frame">
            <img src="photo.jpg" alt="Photo">
        </div>
        
        <div id="text-space" class="message-box">Нажми на кнопку ниже...</div>
        
        <button class="btn" onclick="openCard()">Включить атмосферу</button>
    </div>

    <audio id="my-track" src="music.mp3"></audio>

    <script>
        function openCard() {
            const player = document.getElementById('my-track');
            player.play();

            document.getElementById('text-space').innerHTML = 
                "Рад, что мы дружим. Ты суперская, умная и с тобой всегда весело поугарать. Оставайся такой же крутой и резкой! ☕✨";
            
            document.getElementById('text-space').style.color = '#ffffff';
        }
    </script>

</body>
</html>
